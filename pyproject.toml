[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "D",      # pydocstyle
    "RUF",    # ruff-specific
]
ignore = [
    # Matches home-assistant/core, which ignores all three.
    "D203",   # no-blank-line-before-class, conflicts with D211
    "D213",   # multi-line-summary-second-line, conflicts with D212
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation here, and the loader shim needs no docstrings.
"tests/*" = ["D103"]
